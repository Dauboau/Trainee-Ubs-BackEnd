version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: expensemanager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: expense_manager
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
